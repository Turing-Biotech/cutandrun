# --- Q3 比对口径 -------------------------------------------------------------
alignment_method:
  before_zh_anchor: "本次分析采用 BWA 比对软件 … 本项目分析采用的是 BWA-MEM。</p>"
  after_zh: >-
    本次分析采用 Bowtie2 比对软件。 在比对之前，将下机的 raw data 进行去接头处理，
    得到的 clean data 使用 Bowtie2 分别比对到参考基因组
    ncbi_Mus_musculus_mm39_GCF_000001635.27 与 spike-in 基因组上。
    Bowtie2（Burrows-Wheeler aligner 2）是一种基于 FM-index 的短序列高速比对软件，
    特点是快速、准确、内存占用低，支持局部（gapped）比对模式，是 RNA-seq、ChIP-seq
    及 CUT&Tag 等二代测序数据分析中最常用的比对工具之一。
    本项目分析采用的是 Bowtie2 的局部比对模式（-D 20 -R 3 -N 0 -L 20 -E 2 -u 4）。
  before_en: >-
    Before read mapping, clean reads were obtained from the raw reads by removing
    the adaptor sequences. The clean reads were then aligned to reference genome
    sequences using the bwa program.
  after_en: >-
    Before read mapping, clean reads were obtained from the raw reads by removing
    the adaptor sequences. The clean reads were then aligned to reference genome
    sequences using the bowtie2 program (alignment to both the target genome and
    the spike-in genome).

