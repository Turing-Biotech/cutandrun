# ============================================================================
# assets/zh_CN/missing_data_registry.yml — 交付报告缺失数据登记
# Phase 1 = 本管线 8 模块能给出的全部给出 + 本文件记录缺口；
# Phase 2 = 在 pipeline 后补模块，真实数据替换占位并销账（status: open → done）。
# 每条 = 小节 id + 缺什么 + vendor 侧证据 + 期望数据契约 + Phase 2 补法。
# ============================================================================
version: 1
run: "02:/mnt/data/TL004/15.CUTTAG_Pipeline (8-19 终跑, samplesheet C/E 各 3 重复)"

# --- work-only 输入面（8-19 multiqc task 的 work/ 目录已被清理）-----------
multiqc_work_only:
  status: open
  affected: [FRiP 得分, sample peak 可重复性 %, 片段长度分布, 线性重复水平,
             Picard 重复率(6样本面), 软件版本(6样本), workflow summary]
  vendor_evidence: 参考报告无对应小节（vendor 用自己的 21 阶段内部 QC）
  why_missing: >-
    6 样本生产面从发布 output/ 重建（scripts/build_multiqc_input_face.py），
    但上述小节的数据面只存在于被清理的 8-19 multiqc task work/ 目录
    （peak_metrics/peak_frip、peak_reprod_perc、frag_len、linear_duplicates、
    picard/markduplicates、software_versions 均为 work/ 产物，未发布）。
  data_contract:
    - "peak_frip: 每样本 1 行 _mqc.tsv（header 见 assets/multiqc/frip_score_header.txt）"
    - "peak_reprod_perc: 每 repeat-set 1 行 _mqc.tsv（header 见 peak_reprod_header.txt）"
    - "frag_len: frag_len_mqc.yml（custom linegraph，header 见 frag_len_header.txt）"
    - "linear_duplicates: custom_content tsv（header 见 linear_duplication_header.txt）"
    - "picard: *.MarkDuplicates.metrics.txt 每样本 1 份"
    - "software_versions: software_versions_{unique_,}mqc.yml + workflow_summary_mqc.yml"
  remedi: >-
    Phase 2a: 在 fork 的 MULTIQC 发布步骤中把上述 work/ 产物一并
    publishDir 到 04_reporting/multiqc_inputs/（一次管线参数变更，可随下次运行落地），
    或从 bam 重算（frip/reprod 需要 bam；frag_len 需要 bam 的 pair 距离）。
  crosscheck_2sample: >-
    10-14 的 2 样本（C_R1/E_R1）完整 work 面用于交叉核对数字一致性；
    该面本身无 peak_frip/peak_reprod 数据（其 multiqc 输入面也不完整），
    故此两处即使在 2 样本面也缺席——属运行参数/流程选择，非数据损坏。

