# 配置文件中每个已翻译字符串的最终取值（与 assets/multiqc_config_zh_CN.yml 逐字对应）
report_strings:
  title: "CUT&RUN/CUT&TAG 质控报告（MultiQC 简体中文版）"
  report_comment: >-
    本报告由 <a href="https://github.com/nf-core/cutandrun/releases/tag/3.2.2"
    target="_blank">nf-core/cutandrun</a> 分析流水线生成。关于如何解读这些结果，请参阅
    <a href="https://nf-co.re/cutandrun/3.2.2/docs/output" target="_blank">文档</a>。
  module_names_and_info:
    - key: "module_order[fastqc raw]"
      name: "FastQC（过滤前）"
      info: "本节展示接头去除（adapter trimming）前的 FastQC 原始质量结果。"
    - key: "module_order[fastqc trimmed]"
      name: "FastQC（过滤后）"
      info: "本节展示接头去除（adapter trimming）后的 FastQC 质量结果。"
    - key: "module_order[bowtie2 target]"
      name: "Bowtie2 比对（target 目标序列）"
      info: null
    - key: "module_order[bowtie2 spike-in]"
      name: "Bowtie2 比对（spike-in 内参序列）"
      info: null
    - key: "module_order[samtools]"
      name: "Samtools 比对得分"
      info: null
    - key: "module_order[preseq]"
      name: "文库复杂度（Preseq）"
      info: null
    - key: "module_order[picard]"
      name: "Picard 重复率统计"
      info: null
    - key: "module_order[deeptools]"
      name: "片段长度质量（deeptools）"
      info: null
  section_comments:
    fastqc_raw_fastqc_per_base_sequence_content: >-
      CUT&TAG/RUN 数据中，读段起始端的碱基组成异常是常见现象。Per-base sequence content（逐位点碱基组成）检查不合格并不意味着数据失败。
      - 这可能是由 Tn5 转座酶偏好性造成的。
      - 你观察到的可能是 10 bp 周期性信号，它会以锯齿状波形出现在片段长度分布中。如果是这种情况，属于正常现象，不会影响比对（alignment）或 peak calling（峰值检测）。总之我们不建议做接头去除（trimming），因为所列 bowtie2 参数在不做接头去除的情况下即可给出准确的比对信息。

# 覆盖范围（coverage）：
#   中文（经 config 翻译）:
#     - 报告标题（title，新增键）
#     - 报告脚注/方法说明（report_comment）
#     - 模块名与模块描述（module_order 各实例的 name / info）
#     - 小节批注（section_comments 值）
# 保持英文:
#   - 样本名（由文件名派生，extra_fn_clean_trim 只影响清洗规则）
#   - 工具名与软件名
#   - 文件路径、文件名片段
#   - MultiQC 段落锚点、绘图标识符、plot id
#   - fn/sp 搜索模式与正则（sp.*、extra_fn_clean_trim）
#   - run_modules / module_order / report_section_order / custom_content 的键名
#   - 模块内部小节标题与表格列名（MultiQC 代码硬编码，config 无法覆盖）
#   - assets/multiqc/*.txt 自定义表头（上游追踪文件，workflow 路径硬编码，
#     含 "Peak QC"、"Sample FRiP score"、"Fragment Length Distribution" 等）
never_translate:
  - "sample names"
  - "tool and software names"
  - "file paths and file name fragments"
  - "section anchors, plot ids, plot identifiers"
  - "fn/sp search patterns and regular expressions"
  - "run_modules / module_order / report_section_order / custom_content keys"
  - "module-internal section headings and table column headers (hard-coded in MultiQC)"
  - "assets/multiqc/*.txt custom table headers (upstream-tracked, workflow-hardcoded paths)"
