# ============================================================================
# glossary.yml — 简体中文报告层术语对照表（term contract）
#
# 适用范围: assets/multiqc_config_zh_CN.yml（MultiQC 简体中文层）。
# 规则:
#   1. 配置文件中所有译文必须与下表 zh 值逐字一致；
#   2. keep_en: true 的术语在报告中必须保留英文；
#   3. never_translate 清单中的内容永不翻译；
#   4. 报告标题与脚注采用"中文为主、技术术语在括号内保留英文"的双语格式。
# 风格与 Turing-Biotech/rnaseq 的 REPORT_ZH 中文层保持一致。
#
# 术语:
#   en        英文原文（报告中未翻译处使用）
#   zh        中文译文（配置文件中实际使用的字符串成分）
#   keep_en   为 true 时该术语在报告中保持英文
# 术语表:
